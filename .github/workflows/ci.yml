name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Build-time placeholders only; production credentials remain in the host environment.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-key
      NEXT_PUBLIC_SUPABASE_STORAGE_BUCKET: ci
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-key

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test judge
        run: npm run test:judge

      - name: Test harness
        run: npm run test:harness

      - name: Test application requirements
        run: npm run test:applications

      - name: Build
        run: npm run build

      - name: Check Supabase Edge Functions
        run: deno check --config supabase/functions/application-tracker-mcp/deno.json supabase/functions/application-tracker-mcp/index.ts
